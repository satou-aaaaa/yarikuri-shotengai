<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'">
<title>やりくり商店街（印刷して遊ぶ）</title>
<meta name="description" content="やりくり商店街を紙で遊ぶための印刷用の盤・店札・お金・説明書（A4で7枚）。">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<!-- 店の絵は商用で使える Noto Color Emoji にそろえる（端末の絵文字は売り物に使えないものがある）。text= で使う字だけを読む -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Color+Emoji&text=%F0%9F%A5%95%F0%9F%8D%9E%E2%98%95%F0%9F%93%9A%F0%9F%8F%A0%F0%9F%92%B0%E2%9A%94%E2%9A%A0%F0%9F%8C%A4%E2%98%94%F0%9F%92%B4%F0%9F%93%88%F0%9F%93%89%F0%9F%8F%B7%F0%9F%93%96%F0%9F%8C%85%F0%9F%8F%AE%F0%9F%A7%BE%F0%9F%8E%8C%F0%9F%9A%A7%F0%9F%93%90%F0%9F%9B%A3%F0%9F%8F%A2%F0%9F%90%B7&display=swap">
<style>
/* 印刷の組み方：A4・片面・100%。中身は 186×250mm の中に収め、レターの紙でも切れないようにする。
   インクを減らすため、地は白・色は線と絵だけ。切る線は細い破線。 */
:root{--ink:#1d2a2a;--sub:#4d5b5a;--line:#9aa6a0;--a:#0b6e60;--b:#86306f;--bg:#eef1ea;
  --display:"Noto Color Emoji","Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",system-ui,sans-serif;--body:"Noto Color Emoji","Hiragino Sans","BIZ UDPGothic","Noto Sans JP",system-ui,sans-serif}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;padding:12px max(16px,env(safe-area-inset-left,0px))}
.guide{max-width:640px;margin:0 auto 16px;display:flex;flex-direction:column;gap:8px}
.guide h1{font-family:var(--display);font-size:1.5rem;margin:0}
.guide p,.guide ul{margin:0}
.guide ul{padding-left:1.2em}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btns a,.btns button{font:inherit;font-family:var(--display);font-weight:700;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);padding:8px 16px;min-height:44px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btns button{background:var(--ink);color:#fff}
:is(button,a):focus-visible{outline:3px solid #b4471a!important;outline-offset:2px!important}
.sheets{overflow-x:auto}
.page{width:210mm;height:297mm;overflow:hidden;margin:0 auto 12px;background:#fff;padding:18mm 12mm;box-shadow:0 1px 4px #0003;display:flex;flex-direction:column;gap:4mm;font-size:10pt}
.page h2{font-family:var(--display);font-size:16pt;margin:0}
.page h3{font-family:var(--display);font-size:11.5pt;margin:2mm 0 0}
.page p,.page ol,.page ul{margin:0}
.page ol,.page ul{padding-left:1.3em;display:grid;gap:1mm}
.colophon{border-top:0.3mm solid var(--line);padding-top:2mm;font-size:7.5pt;color:var(--sub);line-height:1.45}
.colophon b{color:var(--ink)}
.foot{margin-top:auto;font-size:8pt;color:var(--sub);display:flex;justify-content:space-between}
.two{display:grid;grid-template-columns:1fr 1fr;gap:5mm}
.two.flow{display:block;columns:2;column-gap:5mm}.two.flow>div{display:contents}.two.flow h3{break-after:avoid}.two.flow li,.two.flow p{break-inside:avoid}
.ref{border:0.4mm solid var(--ink);border-radius:3mm;padding:3mm;display:grid;gap:1.2mm;font-size:9pt}
.ref div{display:grid;grid-template-columns:7mm 1fr;gap:1mm}
table{border-collapse:collapse;width:100%;font-size:9pt}
th,td{border:0.3mm solid var(--line);padding:1mm 1.5mm;text-align:center;height:7mm}
th{font-weight:700}
/* 盤：36mm × 5 */
.board{display:grid;grid-template-columns:repeat(5,36mm);grid-template-rows:repeat(5,36mm);border:0.8mm solid var(--ink);width:max-content;margin:0 auto}
.board div{border:0.3mm solid var(--line);display:flex;align-items:flex-end;justify-content:flex-start;padding:1mm;font-size:7pt;color:var(--sub)}
.street{text-align:center;font-family:var(--display);font-size:11pt;letter-spacing:.3em}
/* 札：切って使う。店札 34mm 角（盤のマスに乗る）・お金 30mm 角・印 20mm 丸 */
.grid{display:grid;justify-content:center}
.tiles{grid-template-columns:repeat(5,34mm);grid-auto-rows:34mm}
.coins{grid-template-columns:repeat(7,24mm);grid-auto-rows:24mm}
.t{border:0.3mm dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:0.5mm;padding:1.5mm;overflow:hidden}
.t .e{font-size:20pt;line-height:1.1}
.t .nm{font-family:var(--display);font-weight:900;font-size:10pt}
.t .x{font-size:6.6pt;line-height:1.3;color:var(--sub)}
.t .c{position:absolute}
.tile{position:relative}
.tile .cost{position:absolute;top:1mm;left:1.5mm;font-size:8pt;font-weight:700}
.tile .base{position:absolute;top:1mm;right:1.5mm;font-size:8pt;font-weight:700}
.coin .v{font-family:var(--display);font-weight:900;font-size:18pt}
.coin.five .v{font-size:22pt}
.coin.five{border-style:solid;border-width:0.6mm;border-color:var(--ink)}
.coin.ten .v{font-size:20pt}
.coin.ten{border-style:double;border-width:1.6mm;border-color:var(--ink)}
.marks{grid-template-columns:repeat(8,22mm);grid-auto-rows:22mm}
.mark{border-radius:50%;font-size:16pt;font-weight:900}
.mark.a{color:var(--a);border:0.8mm solid var(--a)}
.mark.b{color:var(--b);border:0.8mm dashed var(--b)}
.board .ave{background:repeating-linear-gradient(135deg,#fff 0 3mm,#e4e8e2 3mm 3.6mm)}
.mark.up{border:0.6mm solid var(--ink);border-radius:2mm;font-family:var(--display);font-size:10pt}
.marks.ups{grid-template-columns:repeat(8,14mm);grid-auto-rows:14mm}
.cards{grid-template-columns:repeat(4,46mm);grid-auto-rows:34mm}
.card{position:relative}
.card .e{font-size:16pt;line-height:1.1}
.card .x{font-size:7pt}
.card.goal{border-style:solid;border-width:0.5mm;border-color:var(--ink)}
.card .pt{position:absolute;top:1mm;right:1.5mm;font-size:8pt;font-weight:700}
.loans{grid-template-columns:repeat(3,58mm);grid-auto-rows:26mm}
.loan .nm{font-size:11pt}
.loan.tok{border-width:0.8mm;border-color:var(--ink)}
.score{font-size:11pt;margin-top:2mm}
.score th,.score td{border:0.3mm solid var(--ink);height:7.5mm;padding:0 2mm}
.score td{width:30mm}
.score th[scope=row]{text-align:left;font-weight:700}
.score tr:last-child{border-top:0.8mm solid var(--ink)}
@page{size:A4;margin:0}
@media print{
  body{background:#fff;padding:0}
  .guide{display:none}
  .page{margin:0;box-shadow:none;break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
}
</style>
</head>
<body>
<div class="guide">
  <h1>やりくり商店街を紙で遊ぶ</h1>
  <p>下の7枚を印刷し、札を線で切れば、2人で遊べます（基本ルールだけなら1〜5枚目）。用意するのは、はさみだけです。</p>
  <ul>
    <li>紙は A4（レターでも切れません）。片面・カラーでも白黒でも遊べます。</li>
    <li>印刷の大きさは「100%」か「実際のサイズ」にします（店札が盤のマスに乗る大きさです）。</li>
    <li>厚紙に印刷すると、札がめくりやすくなります。</li>
  </ul>
  <div class="btns"><button id="print" type="button">印刷する</button><a href="print-lite.html">切る数の少ない版（4枚）</a><a href="./">ゲームにもどる</a></div>
</div>
<div class="sheets" id="sheets"></div>
<script src="rules.js"></script>
<script>
"use strict";
const Y = window.YRK, S = Y.SHOPS;
const foot = (n) => `<div class="foot"><span>やりくり商店街　https://satou-aaaaa.github.io/yarikuri-shotengai/</span><span>${n} / @@ALL@@</span></div>`;
const ref = () => `<div class="ref"><b>お店のはたらき（となりは上下左右だけ）</b>${Y.KINDS.map((k) => `<div><span>${S[k].e}</span><span><b>${S[k].nm}</b> ${S[k].c}💰・客${S[k].base}：${S[k].txt}</span></div>`).join("")}<div><span>⚔</span><span>同じ種類の店が相手の店ととなり合うと、両方 −1</span></div></div>`;
// 奥付：売るときに箱・袋・説明書に要る表示（対象年齢・小さな部品の注意・作り手と連絡先・絵の出どころ）
const colophon = () => `<div class="colophon" aria-label="奥付"><b>対象年齢 8歳以上・2人用・20〜30分</b>　⚠ 小さな部品があります。のみこむおそれがあるので、3歳未満のお子さまには与えないでください。<br>制作：satou-aaaaa　連絡先：https://github.com/satou-aaaaa/yarikuri-shotengai/issues　第1版 2026年<br>店の絵：Noto Color Emoji（Google。フォントは SIL Open Font License 1.1、絵は Apache License 2.0）</div>`;
const days = Array.from({ length: Y.DAYS }, (_, i) => i + 1);
const pages = [];
// 1. 説明書
pages.push(`<section class="page" aria-label="説明書">
  <h2>やりくり商店街　説明書</h2>
  <p>2人用・20〜30分。5×5の通りにお店を並べて客を呼びます。毎日の計算はありません。点は、囲碁のように<b>おわりに1回だけ</b>数えます。</p>
  <div class="two flow"><div>
  <h3>じゅんび</h3>
  <ol>
    <li>盤をまん中に置きます。</li>
    <li>店札${Y.KINDS.length * Y.PER_KIND}枚を裏にしてよく混ぜ、山にします。</li>
    <li>2人はそれぞれ、印（● か ◆）12枚と${Y.START}💰を持ちます。のこりのお金と借り札は「銀行」。</li>
    <li>じゃんけんで勝った人が<b>優先札</b>を持ちます（この人はおわりに${Y.KOMI}点もらえます。囲碁のコミと同じ考え方。上級ではなし）。</li>
  </ol>
  <h3>1日のながれ</h3>
  <ol>
    <li><b>市場</b>：山から${Y.MARKET}枚めくって並べます。</li>
    <li><b>朝のせり</b>：2人はこっそりお金をにぎって同時に開きます。多いほうが先に取り、にぎった分を銀行に払います。同じなら、どちらも払わず優先札の人が先。そのあと優先札を相手にわたします。</li>
    <li><b>取る</b>：先の人から1人1枚ずつ、お金を払って店札を取り、空き地に置いて自分の印をのせます。取らずに「店番」で1💰もらってもかまいません。だれも取らなかった店札は箱へ。</li>
    <li><b>お金をもらう</b>：2人とも銀行から <b>${Y.ALLOW}💰</b> もらいます（客の数は関係ありません）。</li>
  </ol></div><div>
  <h3>借りる・返す</h3>
  <ul>
    <li>自分の番に、借り札1枚と${Y.LOAN}💰をもらえます（1人${Y.MAX_LOANS}枚まで）。${Y.LOAN}💰を払えば1枚返せます。利息はありません。</li>
    <li>返していない借り札は、おわりに1枚 <b>${Y.LOAN_PT}点</b>引かれます。</li>
  </ul>
  <h3>おわり</h3>
  <ul>
    <li>${Y.DAYS}日目の「お金をもらう」までやったらおしまい。ここで1回だけ、5枚目の点数表に書いて数えます。</li>
    <li><b>お店の客</b>：自分の店の客1人につき1点（🏠住宅は0）。</li>
    <li><b>商店会</b>：上下左右でつながった自分の店（🏠住宅もふくむ）の、いちばん大きいかたまり1軒につき1点。</li>
    <li><b>通り</b>：横5列・たて5列のそれぞれで、自分の店が相手より多ければ${Y.LINE_PT}点（同じならどちらも0）。</li>
    <li>客 ＋ 陣取り ＋ 残ったお金 − 借り札×${Y.LOAN_PT} ＋ コミ が多いほうの勝ち。同じ点なら、客の多いほう。</li>
  </ul>
  <h3>例</h3>
  <p>☕喫茶のとなりに📚本屋と🍞パン屋があれば、喫茶の客は 1＋1＋1＝3。🏠住宅のとなりの🥕八百屋は 1＋2＝3。</p>
  <p>客を数えるときは、自分の店を1軒ずつ指でさし、店札の「客」の数に、となりの分を足します。</p>
  </div></div>
  ${ref()}
  <p style="font-size:8.5pt;color:var(--sub)">スマホやパソコンでも遊べます（2人で1台・1人でAIと）。</p>
  ${colophon()}
  ${foot(1)}
</section>`);
// 2. 盤
pages.push(`<section class="page" aria-label="盤">
  <h2>盤（通り）</h2>
  <p class="street">― 商 店 街 ―</p>
  <div class="board">${Array.from({ length: 25 }, (_, i) => `<div${Y.MAIN.includes(i) ? ' class="ave"' : ""}>${String.fromCharCode(65 + (i % 5))}${1 + Math.floor(i / 5)}${Y.MAIN.includes(i) && i % 5 === 0 ? "　大通り（上級）" : ""}</div>`).join("")}</div>
  <p style="text-align:center;font-size:9pt;color:var(--sub)">店札はマスに1枚。となりは上下左右（ななめは数えません）。斜線の列は上級ルールの大通り（基本ルールではふつうのマス）。</p>
  ${foot(2)}
</section>`);
// 3. 店札
pages.push(`<section class="page" aria-label="店札">
  <h2>店札（${Y.KINDS.length}種類×${Y.PER_KIND}枚）</h2>
  <div class="grid tiles">${Y.KINDS.flatMap((k) => Array.from({ length: Y.PER_KIND }, () => `<div class="t tile"><span class="cost">${S[k].c}💰</span><span class="base">客${S[k].base}</span><span class="e">${S[k].e}</span><span class="nm">${S[k].nm}</span><span class="x">${S[k].txt}</span></div>`)).join("")}</div>
  ${foot(3)}
</section>`);
// 4. お金
pages.push(`<section class="page" aria-label="お金">
  <h2>お金（1💰×30枚・5💰×18枚・10💰×12枚）</h2>
  <div class="grid coins">${Array.from({ length: 30 }, () => `<div class="t coin"><span class="v">1</span><span class="x">💰</span></div>`).join("")}${Array.from({ length: 18 }, () => `<div class="t coin five"><span class="v">5</span><span class="x">💰</span></div>`).join("")}${Array.from({ length: 12 }, () => `<div class="t coin ten"><span class="v">10</span><span class="x">💰</span></div>`).join("")}</div>
  <p style="font-size:8.5pt;color:var(--sub)">足りなくなったら、メモや別の小物で代わりにしてかまいません。</p>
  ${foot(4)}
</section>`);
// 5. 印・借り札・優先札・点数表
const scoreRows = [["お店の客（1人1点）", ""], ["商店会（いちばん大きいかたまり）", ""], [`通り（多い列 × ${Y.LINE_PT}）`, ""], ["残ったお金（1💰1点）", ""], [`返していない借り札（1枚 −${Y.LOAN_PT}）`, "−"], ["秘密の目標（上級）", ""], [`コミ（はじめの優先札に${Y.KOMI}・上級は0）`, ""], ["合計", ""]];
pages.push(`<section class="page" aria-label="印・借り札・点数表">
  <h2>印・借り札・優先札・点数表</h2>
  <div class="grid marks">${["a", "b"].flatMap((o) => Array.from({ length: 12 }, () => `<div class="t mark ${o}">${o === "a" ? "●" : "◆"}</div>`)).join("")}</div>
  <div class="grid loans">${Array.from({ length: 6 }, () => `<div class="t loan"><span class="nm">借り札</span><span class="x">返すときは${Y.LOAN}💰。返さないとおわりに −${Y.LOAN_PT}点</span></div>`).join("")}<div class="t loan tok"><span class="nm">優先札</span><span class="x">せりが同じ額なら、この札の人が先。せりのあと相手にわたす</span></div></div>
  <h3>点数表（${Y.DAYS}日目のおわりに1回だけ書く）</h3>
  <table class="score"><thead><tr><th></th><th>●</th><th>◆</th></tr></thead><tbody>${scoreRows.map(([k, v]) => `<tr><th scope="row">${k}</th><td>${v}</td><td>${v}</td></tr>`).join("")}</tbody></table>
  ${foot(5)}
</section>`);
// 6. 上級ルール・2階の札
pages.push(`<section class="page" aria-label="上級ルール">
  <h2>上級ルール（慣れたら）</h2>
  <p>基本のきまりに、次の4つを足します。7枚目の札と、下の「2F」の札を切って使います。</p>
  <div class="two"><div>
  <h3>大通り</h3>
  <ul><li>盤のまん中の横の列（斜線のマス）は大通り。ここの店は客 +1、置くときの値段も +1💰（🏠住宅は値段だけ +1。客は0のまま）。</li></ul>
  <h3>行事の札（12枚）</h3>
  <ul>
    <li>じゅんび：よく混ぜて${Y.DAYS}枚を裏のまま横に並べ（のこりは箱へ）、1〜${Y.EV_SEE}枚目を表にします。左から1日目・2日目…の札です。</li>
    <li>その日の札は、その日の店札の値段か、その日の「お金をもらう」だけを変えます（客の数は変えません）。2人とも同じです。</li>
    <li>日がおわるたびに、次の1枚を表にします（いつも今日とその先2日分が見えます）。</li>
  </ul>
  </div><div>
  <h3>増築（2階建て）</h3>
  <ul>
    <li>自分の番に、店札を取るかわりに、自分の店（🏠住宅のぞく）1軒に「2F」の札をのせられます。</li>
    <li>払うのはその店の値段（大通りでも +1 なし）。その店の客は +${Y.UP_ADD}。1軒に1回まで。</li>
    <li>陣取りでは、2階建ての店は2軒と数えます（商店会も通りも）。</li>
  </ul>
  <h3>秘密の目標（8枚）</h3>
  <ul>
    <li>じゅんび：よく混ぜて、1人2枚ずつ裏のまま取ります。相手に見せません。のこりは箱へ。</li>
    <li>おわりに、満たしている目標の点も足して比べます。上級ではコミはありません。同じ点なら、客の多いほう。</li>
  </ul>
  </div></div>
  <h3>2Fの札（12枚）</h3>
  <div class="grid marks ups">${Array.from({ length: 12 }, () => `<div class="t mark up">2F</div>`).join("")}</div>
  ${foot(6)}
</section>`);
// 7. 行事の札・目標の札
const evCard = (k) => { const e = Y.EVENTS[k]; return `<div class="t card"><span class="e">${e.e}</span><span class="nm">${e.nm}</span><span class="x">${e.txt}</span></div>`; };
const goalCard = (k) => { const g = Y.GOALS[k]; return `<div class="t card goal"><span class="pt">${g.pt}点</span><span class="e">${g.e}</span><span class="nm">${g.nm}</span><span class="x">${g.txt}</span></div>`; };
pages.push(`<section class="page" aria-label="行事の札・目標の札">
  <h2>行事の札（${Y.EV_KEYS.length}枚）</h2>
  <div class="grid cards">${Y.EV_KEYS.map(evCard).join("")}</div>
  <h2>秘密の目標（${Y.GOAL_KEYS.length}枚）</h2>
  <div class="grid cards">${Y.GOAL_KEYS.map(goalCard).join("")}</div>
  <p style="font-size:8.5pt;color:var(--sub)">「となり合う組」は上下左右。四すみは A1・E1・A5・E5。大通りは A3〜E3。</p>
  ${foot(7)}
</section>`);
document.getElementById("sheets").innerHTML = pages.join("").split("@@ALL@@").join(String(pages.length));
document.getElementById("print").onclick = () => window.print();
